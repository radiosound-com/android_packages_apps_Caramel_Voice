# Streaming quality profile for Raspberry Pi 5 16 GB RAM builds.
# Uses the same INT8 Zipformer artifacts with a larger beam width to improve
# recovery on longer, music-heavy dictation and command phrases.
engine=zipformer
model=zipformer-int8
threads=6
decoding_method=modified_beam_search
max_active_paths=8
hotwords_score=4.2
