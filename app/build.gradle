plugins {
    id "com.android.application"
}

def generatedAssets = layout.buildDirectory.dir("generated/assets")

android {
    namespace "com.radiosound.caramelvoice"
    compileSdk 36

    defaultConfig {
        applicationId "com.radiosound.caramelvoice"
        minSdk 21
        targetSdk 36
        versionCode 1
        versionName "0.1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    sourceSets {
        main {
            assets.srcDir(generatedAssets)
        }
    }

    packaging {
        resources {
            excludes += ["META-INF/AL2.0", "META-INF/LGPL2.1"]
        }
    }
}

tasks.register("unpackVoskModel", Sync) {
    from(zipTree(file("model/vosk-model-small-en-us-0.15.zip")))
    into(generatedAssets)
}

tasks.named("preBuild") {
    dependsOn("unpackVoskModel")
}

dependencies {
    implementation files("libs/vosk-android-0.3.75.aar")
    implementation "net.java.dev.jna:jna:5.18.1@aar"
}
